name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same ref when a new push lands.
# Without this, every force-push or new commit on a PR queued a fresh
# run on top of the previous one — the queue could stack 3+ deep on a
# busy branch and the yellow "in progress" dot would sit for hours
# waiting for a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (projects + ai-config)
        run: npm test

      - name: TypeScript build
        # STATION_SKIP_DITTO=1 short-circuits scripts/fetch-ditto.mjs.
        # CI's smoke test exercises dist/cli.js, not the bundled Ditto
        # SPA, and the source build clones soapbox-pub/ditto + runs npm
        # ci on 1k+ packages (~3-5 min, uncached). Publish-time builds
        # (npm publish → prepublishOnly) DO build Ditto — that's where
        # the artifact actually needs to ship.
        run: STATION_SKIP_DITTO=1 npm run build

      - name: Verify dist output exists
        run: |
          test -f dist/cli.js || { echo "❌ dist/cli.js missing after build"; exit 1; }
          echo "✓ dist/cli.js present"

      - name: Link globally as `nostr-station`
        run: npm link

      - name: --version matches package.json
        run: |
          out=$(nostr-station --version)
          echo "$out"
          expected="nostr-station $(node -p "require('./package.json').version")"
          [[ "$out" == "$expected" ]] || { echo "❌ got '$out', expected '$expected'"; exit 1; }

      - name: Help text lists every command
        run: |
          output=$(nostr-station help)
          echo "$output"
          # Surviving verbs after the simplified-architecture cut:
          # onboard / doctor / update / tui / relay / uninstall were all
          # deleted along with the host-install / Docker-stack legacy
          # infra. `add` + `ai` are new first-class verbs.
          for cmd in start stop status chat keychain ai add seed publish nsite editor completion; do
            echo "$output" | grep -qw "$cmd" || { echo "❌ Missing from help: $cmd"; exit 1; }
          done
          echo "✓ All commands listed in help"

      - name: Unknown command falls through to help
        run: |
          nostr-station nonexistent-command 2>&1 | grep -q "USAGE" || {
            echo "❌ unknown command did not fall through to help"; exit 1;
          }

      - name: status --json emits valid JSON (schema-only check)
        run: |
          # Capture stdout only — nothing else should leak here now that
          # cli.tsx short-circuits --json before mounting Ink.
          nostr-station status --json > /tmp/status.json
          echo "--- raw output ---"
          cat /tmp/status.json
          echo "--- schema check ---"
          python3 <<'PY'
          import json, sys
          with open('/tmp/status.json') as f:
              d = json.load(f)

          # Schema contract — every status row MUST be present as a key,
          # regardless of whether the underlying service is installed/running.
          # In CI nothing is installed, so ok=False is expected and acceptable.
          # This test ONLY validates structure, not values.
          required = {'Relay', 'nostr-vpn', 'watchdog', 'ngit', 'claude-code', 'nak', 'Stacks'}
          missing = required - set(d.keys())
          if missing:
              print(f'FAIL: missing keys: {missing}')
              sys.exit(1)

          # Every row must have {ok: bool, value: str}
          for k, v in d.items():
              if not isinstance(v, dict):
                  print(f'FAIL: {k} is not an object')
                  sys.exit(1)
              if 'ok' not in v or not isinstance(v['ok'], bool):
                  print(f'FAIL: {k}.ok missing or not a bool')
                  sys.exit(1)
              if 'value' not in v or not isinstance(v['value'], str):
                  print(f'FAIL: {k}.value missing or not a string')
                  sys.exit(1)

          ok_count = sum(1 for v in d.values() if v['ok'])
          print(f'OK: all {len(d)} keys present, all rows well-formed')
          print(f'info: {ok_count}/{len(d)} services healthy (not asserted in CI)')
          PY

      - name: Version pinning constants present
        run: |
          # nvpn is the only binary we install directly (download + sha256
          # verify). Other tools (ngit, nak, stacks, nsyte) install via
          # cargo / npm / manual installer URLs, where the toolchain pins
          # the version — versions.ts has no role for them anymore.
          grep -q "'nvpn'" src/lib/versions.ts
          grep -q "BINARY_SHA256" src/lib/versions.ts
          echo "✓ pinned versions declared"

  shellcheck:
    name: install.sh lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: bash syntax check
        run: bash -n install.sh

      - name: ShellCheck
        run: shellcheck install.sh

      # Contract checks — invariants the install.sh / package.json /
      # README curl-pipe-to-bash contract depend on. These are cheap
      # grep-level assertions; they catch the realistic drift modes
      # (someone bumps engines.node without touching install.sh,
      # someone renames the repo, someone deletes the OS guard).
      - name: install.sh contract
        run: |
          set -euo pipefail

          # 1. REQUIRED_NODE in install.sh matches engines.node in package.json.
          script_node=$(grep -E '^REQUIRED_NODE=' install.sh | head -1 | cut -d= -f2)
          pkg_node=$(node -p "require('./package.json').engines.node" | grep -oE '[0-9]+' | head -1)
          if [[ "$script_node" != "$pkg_node" ]]; then
            echo "❌ install.sh REQUIRED_NODE=$script_node but package.json engines.node major=$pkg_node"; exit 1
          fi
          echo "✓ REQUIRED_NODE in sync ($script_node)"

          # 2. REPO_URL points at this repo. Catches a rename / fork-drift
          #    that would otherwise have curl-pipe-to-bash silently install
          #    the wrong project.
          grep -qE '^REPO_URL=.*github\.com[:/]jared-logan/nostr-station' install.sh \
            || { echo "❌ install.sh REPO_URL doesn't point at jared-logan/nostr-station"; exit 1; }
          echo "✓ REPO_URL points at this repo"

          # 3. INSTALL_DIR is the documented ~/nostr-station path. The
          #    README's project-directory layout assumes this, and the
          #    source-tree .gitignore excludes projects/ on this basis.
          grep -qE '^INSTALL_DIR="\$\{HOME\}/nostr-station"' install.sh \
            || { echo "❌ install.sh INSTALL_DIR isn't \${HOME}/nostr-station"; exit 1; }
          echo "✓ INSTALL_DIR is \${HOME}/nostr-station"

          # 4. The clone-and-build steps are all present. Without any one
          #    of these, the script would either skip dependency
          #    installation, ship an unbuilt dist/, or fail to expose the
          #    nostr-station command globally.
          for needle in 'git clone' 'npm install' 'npm run build' 'npm link'; do
            grep -qE "$needle" install.sh \
              || { echo "❌ install.sh is missing step: $needle"; exit 1; }
          done
          echo "✓ clone + install + build + link steps present"

          # 5. OS guard — refuse non-Darwin / non-Linux.
          grep -qE 'Darwin\|Linux' install.sh \
            || { echo "❌ install.sh OS guard for Darwin|Linux missing"; exit 1; }
          echo "✓ OS guard present"

          # 6. The script launches the dashboard at the end. Without this,
          #    `curl … | bash` returns to the shell instead of dropping
          #    the user into the dashboard — the entire UX contract.
          grep -qE '^exec nostr-station' install.sh \
            || { echo "❌ install.sh does not exec nostr-station at the end"; exit 1; }
          echo "✓ exec nostr-station present"
